# NAS 部署：数据库 + 应用 + 定时备份。
# 用法（在 deploy/ 目录）：cp .env.example .env && 修改密码 && docker compose up -d --build
name: cc-lemon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemon
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cc-lemon:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEMON_DATABASE_DSN: postgres://lemon:${DB_PASSWORD}@db:5432/lemon?sslmode=disable
      LEMON_AUTH_TOKEN_TTL: ${TOKEN_TTL:-12h}
      # 可选：挂载自定义会计准则模板目录后启用
      # LEMON_STANDARDS_DIR: /app/standards
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # volumes:
    #   - ./standards:/app/standards:ro

  # 每天一次 pg_dump 到 NAS 目录，保留最近 N 天。
  # 建议再用 NAS 自带的快照 / 异地同步保护备份目录。
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

# NAS 离线部署：镜像已随包提供，不联网、不构建。
#
# 用法（在与本文件同级的目录）：
#   cp .env.example .env && 修改 DB_PASSWORD 与 APP_IMAGE
#   docker compose -f docker-compose.offline.yml up -d
#
# 与 docker-compose.yml 的区别：全部使用 image + pull_policy: never，
# 不写 build，因此不会去 Docker Hub 拉取、也不会尝试本地构建。

name: yanghe-finance

services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: yanghe_finance
      POSTGRES_USER: yanghe_finance
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanghe_finance -d yanghe_finance"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?请在 .env 中设置 APP_IMAGE，例如 yanghe-finance:1.0.0-amd64}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      YANGHE_FINANCE_DATABASE_DSN: postgres://yanghe_finance:${DB_PASSWORD}@db:5432/yanghe_finance?sslmode=disable
      YANGHE_FINANCE_AUTH_TOKEN_TTL: ${TOKEN_TTL:-12h}
      YANGHE_FINANCE_SERVER_ADDR: ":8080"
      YANGHE_FINANCE_SERVER_STATIC_DIR: /app/web
      YANGHE_FINANCE_STORAGE_DIR: /app/data/attachments
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # 凭证图片。NAS 首次创建该目录后需 chown -R 10001:10001 ./data/attachments
      - ${DATA_DIR:-./data}/attachments:/app/data/attachments

  # 每天一次 pg_dump 到 NAS 目录，保留最近 N 天。
  # 建议再用 NAS 自带的快照 / 异地同步保护备份目录。
  backup:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${DATA_DIR:-./data}/attachments:/attachments:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

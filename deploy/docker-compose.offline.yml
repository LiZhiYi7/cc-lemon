# NAS 离线部署：镜像已随包提供，不联网、不构建。
#
# 用法（在与本文件同级的目录）：
#   cp .env.example .env && 修改 DB_PASSWORD 与 APP_IMAGE
#   docker compose -f docker-compose.offline.yml up -d
#
# 与 docker-compose.yml 的区别：全部使用 image + pull_policy: never，
# 不写 build，因此不会去 Docker Hub 拉取、也不会尝试本地构建。

name: cc-lemon

services:
  db:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: lemon
      POSTGRES_USER: lemon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemon -d lemon"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?请在 .env 中设置 APP_IMAGE，例如 cc-lemon:1.0.0-amd64}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEMON_DATABASE_DSN: postgres://lemon:${DB_PASSWORD}@db:5432/lemon?sslmode=disable
      LEMON_AUTH_TOKEN_TTL: ${TOKEN_TTL:-12h}
      LEMON_SERVER_ADDR: ":8080"
      LEMON_SERVER_STATIC_DIR: /app/web
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${HTTP_PORT:-8080}:8080"

  # 每天一次 pg_dump 到 NAS 目录，保留最近 N 天。
  # 建议再用 NAS 自带的快照 / 异地同步保护备份目录。
  backup:
    image: postgres:16-alpine
    pull_policy: never
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

# 运行配置示例。复制为 config.yaml（或用 LEMON_CONFIG 指定路径）。
# 每一项都可用环境变量覆盖，例如 LEMON_SERVER_ADDR、LEMON_DATABASE_DSN。
server:
  addr: ":8080"
  static_dir: "web/dist"      # 前端构建产物；留空则只提供 API
database:
  dsn: "postgres://lemon:lemon@localhost:5432/lemon?sslmode=disable"
  max_conns: 10
auth:
  jwt_secret: ""              # 留空：首次启动自动生成并保存在数据库
  token_ttl: 12h
  roles_file: ""              # 自定义角色权限文件；留空用内置 configs/roles.yaml
standards:
  dir: ""                     # 额外的会计准则模板目录（*.yaml），同 code 覆盖内置模板

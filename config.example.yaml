# 运行配置示例。复制为 config.yaml（或用 YANGHE_FINANCE_CONFIG 指定路径）。
# 每一项都可用环境变量覆盖，例如 YANGHE_FINANCE_SERVER_ADDR、YANGHE_FINANCE_DATABASE_DSN。
server:
  addr: ":8080"
  static_dir: "web/dist"      # 前端构建产物；留空则只提供 API
database:
  dsn: "postgres://yanghe_finance:yanghe_finance@localhost:5432/yanghe_finance?sslmode=disable"
  max_conns: 10
auth:
  jwt_secret: ""              # 留空：首次启动自动生成并保存在数据库
  token_ttl: 12h
  roles_file: ""              # 自定义角色权限文件；留空用内置 configs/roles.yaml
standards:
  dir: ""
  # 只允许使用的准则编码；留空=全部。给只做行政事业单位的客户时填：
  #   allow: ["gov_accounting"]
  allow: []                     # 额外的会计准则模板目录（*.yaml），同 code 覆盖内置模板

storage:
  dir: "data/attachments"       # 凭证图片目录；留空=关闭图片功能
  max_file_mb: 10               # 单张图片上限（MB）
  max_files: 20                 # 单张凭证最多几张图片

# 账套内角色 → 权限。权限点由各模块在路由上声明；"*" 表示全部。
# 第一个角色是账套创建者的默认角色。
# 部署后如需调整：复制本文件修改，并用 auth.roles_file（或 LEMON_AUTH_ROLES_FILE）指向它，重启生效。
roles:
  - code: owner
    name: 账套管理员
    permissions: ["*"]
  - code: accountant
    name: 会计
    permissions: [account:write, opening:write, voucher:write, closing:run, period:close, parallel:write]
  - code: reviewer
    name: 审核
    permissions: [voucher:review]
  - code: viewer
    name: 查看
    permissions: []

# 政府会计制度（行政事业单位）—— 平行记账
# 同一账套内两套核算账簿：财务会计（权责发生制）与预算会计（收付实现制）。
# 一张凭证可同时包含两个账簿的分录，各自借贷平衡。
code: gov_accounting
name: 政府会计制度（行政事业单位）
description: 财务会计与预算会计平行记账，适用于行政事业单位。
account_code_scheme: [4, 2, 2, 2]

voucher_words:
  - {word: 记, title: 记账凭证, default: true}

ledgers:
  - {code: FIN, name: 财务会计, primary: true}
  - {code: BUD, name: 预算会计}

# 预置的辅助核算类别；建账后可在“辅助核算”中增加自定义类别
aux_types:
  - {code: customer, name: 客户}
  - {code: supplier, name: 供应商}
  - {code: employee, name: 职员}
  - {code: department, name: 部门}
  - {code: project, name: 项目}
  # 资金性质：预算会计年末结转按它区分去向（见 closing_rules）。项目编码被结转规则引用，请勿修改编码。
  - code: fund_nature
    name: 资金性质
    items:
      - {code: "01", name: 财政拨款资金}
      - {code: "02", name: 非财政专项资金}
      - {code: "03", name: 其他资金}

categories:

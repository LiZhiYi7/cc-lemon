  # 净资产变动表：矩阵式报表，每行按列分别取数（cells）；“净资产合计”为列间公式。
  # 说明：直接记入“累计盈余”的调整全部列在（三）；用专用基金购置资产而转入累计盈余的部分未单独拆分。
  - code: net_asset_changes
    name: 净资产变动表
    ledger: FIN
    layout: list
    columns:
      - {key: acc, name: 累计盈余}
      - {key: fund, name: 专用基金}
      - {key: equity, name: 权益法调整}
      - {key: total, name: 净资产合计, sum: "acc+fund+equity"}
    rows:
      - {key: 1, name: 一、上年年末余额, bold: true, cells: {acc: ["3001:YBC", "3301:YBC", "3302:YBC", "3401:YBC", "3501:YBC"], fund: ["3101:YBC"], equity: ["3201:YBC"]}}
      - {key: 2, name: 二、以前年度盈余调整（减少以“-”号填列）, cells: {acc: ["3501:YAMT"]}}
      - {key: 3, name: 三、本年年初余额, bold: true, sum: "1+2"}
      - {key: 4, name: 四、本年变动金额（减少以“-”号填列）, bold: true, sum: "5+6+7+8+9+10"}
      - {key: 5, name: （一）本年盈余, indent: 1, cells: {acc: ["@fin_revenue:YAMT", "-@fin_expense:YAMT"]}}
      - {key: 6, name: （二）无偿调拨净资产, indent: 1, cells: {acc: ["3401:YAMT"]}}
      - {key: 7, name: （三）归集调整预算结转结余, indent: 1, cells: {acc: ["3001:YAMT"]}}
      - {key: 8, name: （四）提取或设置专用基金, indent: 1, cells: {acc: ["3302:YAMT"], fund: ["3101:YCA"]}}
      - {key: 9, name: （五）使用专用基金, indent: 1, cells: {fund: ["-3101:YDA"]}}
      - {key: 10, name: （六）权益法调整, indent: 1, cells: {equity: ["3201:YAMT"]}}
      - {key: 11, name: 五、本年年末余额, bold: true, sum: "3+4"}

  # 预算结转结余变动表：单列“计算列”，各行用绝对规则取数；收支差额按“资金性质”拆分。
  # 年末结转完成后，年初 + 本年变动 = 年末。
  - code: budget_carryover_changes
    name: 预算结转结余变动表
    ledger: BUD
    layout: list
    columns:
      - {key: year, name: 本年数}
    rows:
      - {key: 1, name: 一、年初预算结转结余, bold: true, sum: "2+3"}

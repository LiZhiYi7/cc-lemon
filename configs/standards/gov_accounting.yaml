# 平行记账规则：财务会计分录涉及“现金类”科目（cash: true）时，
# 按下表把每条财务会计分录映射为同方向、同金额的预算会计分录。
# side 限定只在借方(D)或贷方(C)发生时适用；未写表示借贷均适用。
# 匹配时先找科目本身，再逐级找上级科目。建账后可在“平行记账规则”中按单位情况调整
# （例如行政单位把 5001 → 7101 行政支出）。
parallel:
  - source: FIN
    target: BUD
    rules:
      - {from: 1001, to: 800102}
      - {from: 1002, to: 800102}
      - {from: 1021, to: 800102}
      - {from: 1011, to: 800101}
      - {from: 1201, to: 800103}
      - {from: 4001, to: 6001}
      - {from: 4101, to: 6101}
      - {from: 4201, to: 6201}
      - {from: 4301, to: 6301}
      - {from: 4401, to: 6401}
      - {from: 4601, to: 6601}
      - {from: 4602, to: 6602}
      - {from: 4603, to: 6609}
      - {from: 4604, to: 6609}
      - {from: 4605, to: 6609}
      - {from: 4609, to: 6609}
      - {from: 5001, to: 7201, note: 行政单位请改为 7101 行政支出}
      - {from: 5101, to: 7201}
      - {from: 5201, to: 7301}
      - {from: 5401, to: 7401}
      - {from: 5501, to: 7501}
      - {from: 5901, to: 7901}
      - {from: 2001, side: C, to: 6501, note: 借入款项}
      - {from: 2001, side: D, to: 7701, note: 归还本金}
      - {from: 2501, side: C, to: 6501, note: 借入款项}
      - {from: 2501, side: D, to: 7701, note: 归还本金}
      - {from: 1501, side: D, to: 7601, note: 对外投资}
      - {from: 1502, side: D, to: 7601, note: 对外投资}
      - {from: 1214, side: D, to: 7201, note: 预付款项}
      - {from: 1302, side: D, to: 7201, note: 购入库存物品}
      - {from: 1601, side: D, to: 7201, note: 购置固定资产}
      - {from: 1613, side: D, to: 7201, note: 支付工程款}
      - {from: 1701, side: D, to: 7201, note: 购置无形资产}
      - {from: 2201, side: D, to: 7201, note: 发放职工薪酬}
      - {from: 2302, side: D, to: 7201, note: 支付应付账款}
      - {from: 1212, side: C, to: 6101, note: 收回应收账款}
      - {from: 2305, side: C, to: 6101, note: 预收款项}

closing_rules:
  - code: fin_surplus
    name: 结转本期盈余
    ledger: FIN
    frequency: monthly
    source_categories: [fin_revenue, fin_expense]
    target: 3301
    summary: 结转本期收入费用
    exclude_from_activity: true
    required: true
  - code: fin_year_distribution
    name: 结转本年盈余分配
    ledger: FIN
    frequency: yearly
    source_accounts: [3301]
    target: 3302
    summary: 本期盈余转入本年盈余分配
    exclude_from_activity: true

  - code: fin_year_accumulate
    name: 结转累计盈余
    ledger: FIN
    frequency: yearly
    source_accounts: [3302, 3401, 3501]
    target: 3001
    summary: 年末转入累计盈余

  # ---- 预算会计年末结转（按顺序执行）----
  # 预算收入、支出按资金性质分别转入：财政拨款结转 / 非财政拨款结转 / 其他结余 / 经营结余。
    exclude_from_activity: true

  - code: bud_fiscal
    name: 结转财政拨款收支
    ledger: BUD
    frequency: yearly
    sources:
      - {accounts: [6001]}
      - {categories: [bud_expense], aux: {fund_nature: "01"}}
    target: 8101
    summary: 年末结转财政拨款预算收支
    exclude_from_activity: true
    required: true
  - code: bud_special
    name: 结转非财政专项资金收支
    ledger: BUD
    frequency: yearly
    sources:
      - {categories: [bud_revenue, bud_expense], aux: {fund_nature: "02"}}
    target: 8201
    summary: 年末结转非财政专项资金预算收支
    exclude_from_activity: true
    required: true
  - code: bud_operating
    name: 结转经营收支
    ledger: BUD
    frequency: yearly
    sources:
      - {accounts: [6401, 7301]}
    target: 8401
    summary: 年末结转经营预算收支
    exclude_from_activity: true
    required: true
  # 其余全部预算收支（含未区分资金性质的科目）转入其他结余；须排在上面三条之后。
  - code: bud_other
    name: 结转其他资金收支
    ledger: BUD
    frequency: yearly
    sources:
      - {categories: [bud_revenue, bud_expense], aux: {fund_nature: "03"}, unbound: true}
    target: 8501
    summary: 年末结转其他资金预算收支
    exclude_from_activity: true
    required: true
  # 事业单位：其他结余、经营结余（仅盈余）转入非财政拨款结余分配，再转入非财政拨款结余。
  # 行政单位没有结余分配环节：请把 bud_other_distribution 的目标科目改为 8202。
  # 需要提取专用基金的，在执行 bud_distribution 之前手工录入凭证（借 8701 贷 8301）。
  - code: bud_other_distribution
    name: 其他结余转入结余分配
    ledger: BUD
    frequency: yearly
    source_accounts: [8501]
    target: 8701
    summary: 其他结余转入非财政拨款结余分配
    exclude_from_activity: true

  - code: bud_operating_distribution
    name: 经营结余转入结余分配
    ledger: BUD
    frequency: yearly
    source_accounts: [8401]
    only_if: credit
    target: 8701
    summary: 经营结余转入非财政拨款结余分配
    exclude_from_activity: true

  - code: bud_distribution
    name: 结余分配转入非财政拨款结余
    ledger: BUD
    frequency: yearly
    source_accounts: [8701]
    target: 8202
    summary: 非财政拨款结余分配转入非财政拨款结余
    exclude_from_activity: true


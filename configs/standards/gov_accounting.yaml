      - {code: 1502, name: 长期债券投资, dir: D}
      - {code: 1601, name: 固定资产, dir: D}
      - {code: 1602, name: 固定资产累计折旧, dir: C}
      - {code: 1611, name: 工程物资, dir: D}
      - {code: 1613, name: 在建工程, dir: D}

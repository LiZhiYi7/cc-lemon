    code: fin_asset
    name: 资产
    accounts:
      - {code: 1001, name: 库存现金, dir: D, cash: true}
      - {code: 1002, name: 银行存款, dir: D, cash: true}
      - {code: 1011, name: 零余额账户用款额度, dir: D, cash: true}
      - {code: 1021, name: 其他货币资金, dir: D, cash: true}
      - {code: 1101, name: 短期投资, dir: D}
      - {code: 1201, name: 财政应返还额度, dir: D, cash: true}

      - {key: 6, name: 1．本年收支差额, indent: 2, terms: ["6001:YAMT", "-@bud_expense:YAMT#fund_nature=01"]}
      - {key: 7, name: 2．年初余额调整、归集调入、上缴或调出（净额）, indent: 2, terms: ["8101:YAMT", "8102:YAMT"]}
      - {key: 8, name: （二）其他资金结转结余, indent: 1, sum: "9+10"}
      - {key: 9, name: 1．本年收支差额, indent: 2, terms: ["@bud_revenue:YAMT", "-6001:YAMT", "-@bud_expense:YAMT", "@bud_expense:YAMT#fund_nature=01"]}
      - {key: 10, name: 2．年初余额调整、缴回资金、使用专用结余、支付所得税等（净额）, indent: 2, terms: ["8201:YAMT", "8202:YAMT", "8301:YAMT", "8401:YAMT", "8501:YAMT", "8701:YAMT"]}
      - {key: 11, name: 三、年末预算结转结余, bold: true, sum: "12+15"}
      - {key: 12, name: （一）财政拨款结转结余, indent: 1, sum: "13+14"}
      - {key: 13, name: 1．财政拨款结转, indent: 2, terms: ["8101:EC"]}
      - {key: 14, name: 2．财政拨款结余, indent: 2, terms: ["8102:EC"]}
      - {key: 15, name: （二）其他资金结转结余, indent: 1, sum: "16+17+18+19"}
      - {key: 16, name: 1．非财政拨款结转, indent: 2, terms: ["8201:EC"]}
      - {key: 17, name: 2．非财政拨款结余, indent: 2, terms: ["8202:EC", "8501:EC", "8701:EC"]}
      - {key: 18, name: 3．专用结余, indent: 2, terms: ["8301:EC"]}
      - {key: 19, name: 4．经营结余（如有余额，以“-”号填列）, indent: 2, terms: ["8401:EC"]}
